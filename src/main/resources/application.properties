spring.application.name=real-estate-crm
server.port=8080

# MySQL connection. Set REAL_ESTATE_DB_USER and REAL_ESTATE_DB_PASSWORD in your environment.
spring.datasource.url=${REAL_ESTATE_DB_URL:jdbc:h2:file:./data/real-estate-crm;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${REAL_ESTATE_DB_USER:sa}
spring.datasource.password=${REAL_ESTATE_DB_PASSWORD:}
spring.datasource.driver-class-name=${REAL_ESTATE_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.hiddenmethod.filter.enabled=true

# Password reset security. Set APP_PASSWORD_RESET_DEV_OTP_ENABLED=true only for local testing.
app.password-reset.otp-expiry=PT15M
app.password-reset.token-expiry=PT10M
app.password-reset.max-attempts=5
app.password-reset.request-window=PT1M
app.password-reset.dev-otp-enabled=${APP_PASSWORD_RESET_DEV_OTP_ENABLED:false}
app.password-reset.encryption-key=${APP_PASSWORD_RESET_ENCRYPTION_KEY:local-only-change-this-password-reset-key}

# Gmail SMTP: use a Google App Password, not your normal Google password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset.mail-from=${GMAIL_USERNAME:}
# Avoid logging authentication request/response bodies, including reset tokens.
logging.level.org.springframework.web=INFO
